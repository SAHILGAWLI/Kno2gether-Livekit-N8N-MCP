[project]
name = "kno2gether-livekit-n8n-mcp"
version = "0.1.0"
description = "LiveKit agent with MCP tools integration"
requires-python = ">=3.10,<3.14"
dependencies = [
    "livekit-agents>=1.0.0rc7",
    "livekit-plugins-openai>=1.0.0rc7",
    "livekit-plugins-silero>=1.0.0rc7",
    "livekit-plugins-deepgram>=1.0.0rc7",
    "mcp",
    "python-dotenv",
]

[tool.uv]
python-preference = "only-managed"
